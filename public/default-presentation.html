<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Akuzem Canlı Ders</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #184361 0%, #123456 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 800px;
        }
        .logo {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .logo img {
            width: 160px;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 20px 0;
            font-weight: 900;
        }
        p {
            font-size: 1.5rem;
            margin: 0;
            opacity: 0.9;
        }
        .footer {
            margin-top: 40px;
            font-size: 1rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Akü logosu buraya gelecek, şimdilik placeholder -->
            <img src="https://aku.edu.tr/wp-content/themes/akudenemetema/img/logomobil1.png" alt="AKÜ Logo">
        </div>
        <h1>Akuzem Canlı Ders Sistemine Hoş Geldiniz!</h1>
        <p>Derse başlamadan önce lütfen mikrofonunuzu kontrol edin.</p>
        <div class="footer">Afyon Kocatepe Üniversitesi Uzaktan Eğitim Merkezi</div>
    </div>
</body>
</html>
